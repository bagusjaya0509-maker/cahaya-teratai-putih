<script>
// Warna langit mengikuti jam di Mataram (WITA); dipasang sebelum halaman digambar.
(function () {
  var d = new Date(), j = (d.getUTCHours() + 8) % 24 + d.getUTCMinutes() / 60;
  var uji = new URLSearchParams(location.search).get('langit');
  document.documentElement.dataset.langit = uji || (j < 5 ? 'malam' : j < 6.75 ? 'subuh' : j < 11 ? 'pagi' : j < 16 ? 'siang' : j < 18.75 ? 'senja' : 'malam');
})();
</script>
